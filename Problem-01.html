
<!DOCTYPE html>
<html lang="en">
<head>
    <title>ByteXL Navbar</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, Helvetica, sans-serif;
            background-color: #1b1b1b;
        }

        .navbar {
            width: 100%;
            margin-top: 196px;
            background-color: #ffffff;
        }

        .top-nav {
            height: 112px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 32px 0 42px;
            border-bottom: 1px solid #e5e5e5;
        }

        .logo {
            color: #159447;
            font-size: 34px;
            font-weight: bold;
            letter-spacing: -1px;
        }

        .main-links {
            display: flex;
            align-items: center;
            gap: 42px;
            margin-left: auto;
            margin-right: auto;
        }

        .main-links a {
            color: #17212b;
            text-decoration: none;
            font-size: 20px;
            font-weight: 500;
            white-space: nowrap;
        }

        .sign-in {
            background-color: #17232b;
            color: white;
            border: none;
            border-radius: 10px;
            padding: 14px 25px;
            font-size: 18px;
            font-weight: bold;
            cursor: pointer;
        }

        .sub-nav {
            min-height: 59px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 36px;
            padding: 12px 20px;
            overflow-x: auto;
        }

        .sub-nav a {
            color: #17212b;
            text-decoration: none;
            font-size: 17px;
            white-space: nowrap;
        }

        .main-links a:hover,
        .sub-nav a:hover {
            color: #159447;
        }

        .sign-in:hover {
            background-color: #263943;
        }

        @media (max-width: 900px) {
            .top-nav {
                padding: 20px;
                height: auto;
                min-height: 90px;
                gap: 20px;
            }

            .logo {
                font-size: 28px;
            }

            .main-links {
                gap: 18px;
            }

            .main-links a {
                font-size: 16px;
            }

            .sub-nav {
                justify-content: flex-start;
                gap: 25px;
            }
        }

        @media (max-width: 600px) {
            .navbar {
                margin-top: 0;
            }

            .top-nav {
                flex-wrap: wrap;
            }

            .main-links {
                order: 3;
                width: 100%;
                justify-content: space-between;
            }

            .sign-in {
                padding: 10px 16px;
                font-size: 15px;
            }

            .sub-nav a {
                font-size: 15px;
            }
        }
    </style>
</head>

<body>

    <header class="navbar">

        <div class="top-nav">

            <div class="logo">ByteXL</div>

            <nav class="main-links">
                <a href="#">Courses</a>
                <a href="#">Tutorials</a>
                <a href="#">Practice</a>
                <a href="#">Jobs</a>
            </nav>

            <button class="sign-in">Sign In</button>

        </div>

        <nav class="sub-nav">
            <a href="#">DSA</a>
            <a href="#">Practice Problems</a>
            <a href="#">C</a>
            <a href="#">C++</a>
            <a href="#">Java</a>
            <a href="#">Python</a>
            <a href="#">JavaScript</a>
            <a href="#">Data Science</a>
            <a href="#">Machine Learning</a>
            <a href="#">Courses</a>
            <a href="#">Linux</a>
            <a href="#">DevOps</a>
        </nav>

    </header>

</body>
</html>
